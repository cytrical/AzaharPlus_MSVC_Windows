name: citra-build

on:
  workflow_dispatch:
  push:
    tags: ["*"]

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: windows
      TARGET: msvc
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ env.TARGET }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ env.TARGET }}-

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install extra tools
        run: choco install ccache ninja ptime wget

      - name: Install Vulkan SDK
        run: |
          wget https://sdk.lunarg.com/sdk/download/1.4.304.1/windows/VulkanSDK-1.4.304.1-Installer.exe -O D:/a/_temp/vulkan.exe
          D:/a/_temp/vulkan.exe --accept-licenses --default-answer --confirm-command install

      - name: Disable line ending translation
        run: git config --global core.autocrlf input

      - name: Build
        run: ./.ci/windows.sh

      - name: Pack
        run: ./.ci/pack.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc
          path: artifacts/
